[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino
lib_extra_dirs = ~/Documents/Arduino/libraries
monitor_speed = 115200
upload_port = /dev/ttyACM0
build_src_filter = +<stepper_control_test.ino> -<ForceSensorInterface.ino> +<stepper/*.cpp>

[env:megaatmega2560_forceSensor]
platform = atmelavr
board = megaatmega2560
framework = arduino
lib_deps = RobTillaart/HX711@^0.4.0
lib_extra_dirs = ~/Documents/Arduino/libraries
monitor_speed = 115200
upload_port = /dev/ttyACM1
build_src_filter = +<ForceSensorInterface.ino> -<stepper_control_test.ino> -<stepper/*>